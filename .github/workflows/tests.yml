name: Automated tests

on:
  pull_request:
  # E3 (Audit Lauf 5): auch nach dem Merge auf main – erst danach veröffentlicht pages.yml (workflow_run)
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Projektzentrale daneben holen (spektron-ordner.js byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
        # gleichnamiger Zweig in der Projektzentrale, falls es ihn gibt (Änderung in mehreren Repos), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale
      - name: LabelKit daneben holen (Regel „Laborauftrag je Probe“ gegen LabelKits echten Code prüfen, ab 2.7.0)
        env:
          ZWEIG: ${{ github.head_ref }}
        # gleichnamiger Zweig in LabelKit, falls es ihn gibt (Änderung in mehreren Repos), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/labelkit.git ../labelkit 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/labelkit.git ../labelkit
      - run: node tests/uebernehmen.cjs
      - run: node tests/skalen-archiv.mjs
      - run: node tests/spektron-ordner.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - run: node tests/kopien-pz.mjs
        env:
          ROLLE_PFLICHT: '1'
      - run: node tests/auftrag-labelkit.mjs
        env:
          LABELKIT_PFLICHT: '1'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: Synthetic tests (core in Node, app in Chromium)
        run: pnpm test
